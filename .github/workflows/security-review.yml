name: Security review

# The reviewer reads a pull request diff and comments its findings there, so it
# only runs on pull_request. Pushing straight to main never opens one, which
# means changes have to arrive by branch and PR for this to see them.

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Review the changes
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          comment-pr: true
          # generated spreadsheets and private imports are not application code
          exclude-directories: data,dist
